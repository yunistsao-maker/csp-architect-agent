# Portal agents behind the ingress gateway (read by gateway/deploy.py).
#
# SANDBOX configuration: no corporate services yet. Users come from the Cognito test pool (deploy.py creates yhtsao
# + fake users), and merge requests go to a sandbox repository on github.com. For the enterprise setup (corporate
# IdP, internal GitLab / GHE over TGW + DX) see agents.enterprise.yaml:
#     python gateway/deploy.py --agents-config gateway/agents.enterprise.yaml --discovery-url ... --allowed-audience ...
#
# Each agent is its own AgentCore Runtime (its own IAM role, deploys and scaling), reachable only through the ingress
# gateway at https://<gateway host>/<target>/invocations. Deploy each runtime first with `agentcore configure -e
# <entrypoint> -n <agent_name> ...` + `agentcore deploy -a <agent_name>`; deploy.py finds the ARNs in
# .bedrock_agentcore.yaml by agent_name (or pass --runtime <key>=<arn>).
agents:
  csp-architect:
    agent_name: csp_architect_agent
    entrypoint: agent.py
    target: csp-architect
    kind: null                     # sends no x-agent-kind header -> "_default" in the tool ACL
    tools: [web-search-tool, postprocess-hook]
  coe:
    agent_name: coe_doc_agent
    entrypoint: coe_agent.py
    target: coe-doc
    kind: coe
    tools: [git-pr]
  aicoe:
    agent_name: aicoe_doc_agent
    entrypoint: aicoe_agent.py
    target: aicoe-doc
    kind: aicoe
    tools: [git-pr]
  terraform:
    agent_name: terraform_agent
    entrypoint: terraform_agent.py
    target: terraform
    kind: terraform
    tools: [web-search-tool, git-pr]

# Sandbox Git: one private github.com repository (create it with a README so `main` exists), one folder per agent.
# Token: a fine-grained personal access token limited to that repository with Contents, Pull requests and Issues
# read/write, stored in Secrets Manager under token_secret_name.
git:
  provider: github
  api_url: https://api.github.com
  token_secret_name: csp-arch/github-token
  network: public                                    # Lambda outside the VPC: github.com is on the internet
  ca_bundle: null
  egress_cidrs: []
  profiles:
    terraform: {repo: yunistsao-maker/portal-agents-sandbox, base: main, path_prefix: terraform/,
                labels: [agent, terraform], suffixes: [.tf, .md, .tfvars.example, .tftest.hcl, .json, .tpl, .yaml, .yml]}
    coe:       {repo: yunistsao-maker/portal-agents-sandbox, base: main, path_prefix: docs/coe/, labels: [agent, ccoe],
                suffixes: [.md]}
    aicoe:     {repo: yunistsao-maker/portal-agents-sandbox, base: main, path_prefix: docs/aicoe/, labels: [agent, aicoe],
                suffixes: [.md]}

retention:
  session_ttl_days: 90      # DynamoDB TTL on conversation sessions
  upload_days: 90           # S3 lifecycle on uploads/ (images, documents) and offloaded sessions/
  job_days: 7               # S3 lifecycle on jobs/ (async job records)
